name: design-forge

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - app_db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/vps/init-db.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U design_forge -d design_forge"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    stop_grace_period: 60s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3002"
      TRUST_PROXY_HOPS: "1"
      DATABASE_URL: postgresql://design_forge@db:5432/design_forge
      DATABASE_PASSWORD_FILE: /run/secrets/app_db_password
      PUBLIC_API_URL: https://${DOMAIN:?Set DOMAIN in .env}
      CORS_ORIGINS: https://${DOMAIN:?Set DOMAIN in .env}
      STORAGE_DRIVER: s3
    secrets:
      - app_db_password
    volumes:
      - legacy_uploads:/app/apps/api/uploads:ro
    networks: [web, database]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    stop_grace_period: 60s
    security_opt: [no-new-privileges:true]
    logging: *logging

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certificates:/etc/letsencrypt:ro
      - acme_challenges:/var/www/certbot:ro
    networks: [web]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *logging

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      CERT_EMAIL: ${CERT_EMAIL:?Set CERT_EMAIL in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap 'exit 0' TERM INT
        while :; do
          certbot renew --webroot -w /var/www/certbot --non-interactive
          sleep 43200 &
          wait $$!
        done
    volumes:
      - certificates:/etc/letsencrypt
      - acme_challenges:/var/www/certbot
    networks: [web]
    logging: *logging

volumes:
  postgres_data:
    name: design-forge_postgres_data
  certificates:
  acme_challenges:
  legacy_uploads:

networks:
  web:
  database:
    internal: true

secrets:
  postgres_password:
    file: ./deploy/vps/secrets/postgres_password.txt
  app_db_password:
    file: ./deploy/vps/secrets/app_db_password.txt
